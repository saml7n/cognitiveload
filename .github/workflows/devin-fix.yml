name: Devin Auto-Fix

on:
  issue_comment:
    types: [edited]

permissions:
  issues: write          # Update comments, add labels
  contents: write        # Devin creates branches (via its GitHub App, but we need this for checkout)
  pull-requests: write   # Devin opens PRs
  actions: read          # Read workflow status

jobs:
  fix:
    name: Attempt Auto-Fix with Devin
    runs-on: ubuntu-latest

    # Only run when:
    # 1. The edited comment contains the triage marker (it's a bot triage comment).
    # 2. The auto-fix checkbox was ticked in this edit.
    if: >-
      contains(github.event.comment.body, '<!-- devin-triage:v1') &&
      contains(github.event.comment.body, '- [x] Attempt auto-fix with Devin') &&
      !contains(github.event.changes.body.from, '- [x] Attempt auto-fix with Devin')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests jsonschema pydantic python-dotenv

      - name: Verify issue has devin:triaged label
        id: check-label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            | python3 -c "import sys,json; print(','.join(l['name'] for l in json.load(sys.stdin)))")
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          if echo "$LABELS" | grep -q "devin:triaged"; then
            echo "has_label=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_label=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Issue does not have devin:triaged label — skipping fix."
          fi

      - name: Run fix orchestrator
        if: steps.check-label.outputs.has_label == 'true'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PYTHONPATH=. python -m orchestrator.devin_fix
